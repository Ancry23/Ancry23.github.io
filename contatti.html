<body>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html"><img src="logo.svg" alt="Andrei Cristian Moldovan" height="28"></a>
      <input type="checkbox" id="nav-toggle" class="nav-toggle-input">
      <label for="nav-toggle" class="nav-toggle-label">Menu</label>
      <nav class="site-nav">
        <a href="index.html">Home</a>
        <a href="cv.html">CV</a>
        <a href="contatti.html" aria-current="page">Contatti</a>
      </nav>
    </div>
  </header>

  <main class="container section">
    <h1>Contattami</h1>
    <p>Compila il modulo. Ti risponderò il prima possibile.</p>

    <!-- Il form invia i dati a Formspree: l'action è l'indirizzo del form creato nella dashboard. -->
    <form class="contact-form" action="https://formspree.io/f/xjyyqbjj" method="POST">
      <div class="mb-3">
        <label class="form-label fw-semibold" for="nome">Nome e cognome</label>
        <input class="form-control" id="nome" name="nome" type="text" autocomplete="name" required>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold" for="email">Email</label>
        <input class="form-control" id="email" name="email" type="email" autocomplete="email" required>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold" for="motivo">Motivo del contatto</label>
        <select class="form-select" id="motivo" name="motivo" required>
          <option value="">Scegli un'opzione</option>
          <option value="lavoro">Opportunità di lavoro</option>
          <option value="collaborazione">Collaborazione</option>
          <option value="altro">Altro</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold" for="messaggio">Messaggio</label>
        <textarea class="form-control" id="messaggio" name="messaggio" rows="5" minlength="10" required></textarea>
      </div>

      <!-- Campo anti-spam: nascosto ai visitatori, i bot lo compilano e Formspree scarta il messaggio -->
      <div class="visually-hidden" aria-hidden="true">
        <label for="gotcha">Non compilare questo campo</label>
        <input id="gotcha" name="_gotcha" type="text" tabindex="-1" autocomplete="off">
      </div>

      <div class="form-check mb-4">
        <input class="form-check-input" id="privacy" name="privacy" type="checkbox" required>
        <label class="form-check-label" for="privacy">Acconsento al trattamento dei dati per rispondere alla richiesta, come spiegato nell'<a href="privacy.html">informativa privacy</a>.</label>
      </div>

      <button type="submit" class="btn btn-accent">Invia messaggio</button>
    </form>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p class="footer-copy"><img src="logo.svg" alt="" height="20"> &copy; 2026 Andrei Cristian Moldovan</p>
